# CI: the kit and validator tests (no GPU; the fixture driver stands in for libcuda and is rejected as
# evidence). Host evidence on a GitHub runner; it never touches a GPU. The kernel rebuild job was removed
# with the cubin writer it ran: removed pending clean-room rewrite (CudaLicenseRisk Q6), see README.md.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: machine
        run: uname -a; python3 --version; nproc
      - name: tests/run.sh (kit, validator negative controls, board)
        run: sh tests/run.sh
